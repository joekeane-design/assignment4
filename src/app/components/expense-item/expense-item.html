<div class="expense-item">
  <div class="card-title">
    <h3>{{ expense.title }}</h3>
  </div>
  <div class="card-content">
    <p>Amount: {{ expense.amount | currency }}</p>
    <p>Type: {{expense.type }}</p>
    <p>Category: {{ expense.category }}</p>
    <p>Date: {{expense.date}}</p>
    <p>Notes: {{expense.notes}}</p>
    
  </div>
  <div class="card-footer">
    <button type="button" (click)="onEditClick(expense)">Edit</button>
    <button type="button" (click)="onDeleteClick()">Delete</button>
  </div>
</div>
