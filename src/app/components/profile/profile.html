<section class="profile-shell">
  <h2>Profile</h2>

  <div class="profile-card">

    <div class="avatar">{{ initials }}</div>

    <div *ngIf="successMessage" class="success-message">{{ successMessage }}</div>
    <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>

    <!-- View mode -->
    <ng-container *ngIf="!editMode">
      <div class="profile-field">
        <span class="field-label">Email</span>
        <span class="field-value">{{ currentUser()?.email }}</span>
      </div>
      <div class="profile-field">
        <span class="field-label">Monthly Budget Goal</span>
        <span class="field-value">{{ (currentUser()?.budgetGoal ?? 0) | currency }}</span>
      </div>
      <div class="profile-field">
        <span class="field-label">Password</span>
        <span class="field-value">••••••••</span>
      </div>
      <div class="profile-actions">
        <button type="button" class="btn-primary" (click)="enterEditMode()">Edit Profile</button>
        <button type="button" class="btn-secondary" (click)="logout()">Log Out</button>
      </div>
    </ng-container>

    <!-- Edit mode -->
    <form *ngIf="editMode" (ngSubmit)="onSave()">
      <div class="form-row">
        <label for="profile-email">Email</label>
        <input
          id="profile-email"
          type="email"
          name="email"
          [(ngModel)]="email"
          required
        />
      </div>
      <div class="form-row">
        <label for="profile-budget">Monthly Budget Goal</label>
        <input
          id="profile-budget"
          type="number"
          name="budgetGoal"
          min="0"
          step="1"
          [(ngModel)]="budgetGoal"
        />
      </div>
      <div class="form-row">
        <label for="profile-password">New Password <span class="optional">(leave blank to keep current)</span></label>
        <input
          id="profile-password"
          type="password"
          name="newPassword"
          [(ngModel)]="newPassword"
        />
      </div>
      <div class="form-row">
        <label for="profile-confirm">Confirm New Password</label>
        <input
          id="profile-confirm"
          type="password"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
        />
      </div>
      <div class="profile-actions">
        <button type="submit" class="btn-primary" [disabled]="isLoading">
          {{ isLoading ? 'Saving...' : 'Save Changes' }}
        </button>
        <button type="button" class="btn-secondary" (click)="cancelEdit()">Cancel</button>
      </div>
    </form>

  </div>
</section>
