<section class="expense-form-shell">
  <h2>Add New Expense</h2>

  <form class="expense-form" (ngSubmit)="onSubmit()">
    <div class="form-row">
      <label for="expense-title">Title</label>
      <input
        id="expense-title"
        type="text"
        name="title"
        [(ngModel)]="title"
        required
      />
    </div>

    <div class="form-row">
      <label for="expense-amount">Amount</label>
      <input
        id="expense-amount"
        type="number"
        min="0"
        step="1"
        name="amount"
        [(ngModel)]="amount"
        required
      />
    </div>
    <div class="form-row">
      <label for="expense-type">Type</label>
      <select
        id="form-select"
        name="type"
        [(ngModel)]="type"
        required
      >
        <option
          *ngFor="let type of expenseService.expensetype()"
          [value]="type"
        >
          {{ type }}
        </option>
      </select>
    </div>
    <div class="form-row">
      <label for="expense-category">Category</label>
      <select
        id="form-select"
        name="category"
        [(ngModel)]="category"
        required
      >
        <option
          *ngFor="let category of expenseService.expenseCategories()"
          [value]="category"
        >
          {{ category }}
        </option>
      </select>
      <button type="button" class="add-category-toggle" (click)="showCategoryInput = !showCategoryInput">
        {{ showCategoryInput ? '− Cancel' : '+ Add Category' }}
      </button>
    </div>

    <div class="form-row category-input-row" *ngIf="showCategoryInput">
      <input
        type="text"
        name="newCategory"
        [(ngModel)]="newCategory"
        placeholder="New category name"
      />
      <button type="button" class="add-category-btn" (click)="onAddCategory()">Add</button>
    </div>
    <div class="form-row">
      <label for="expense-date">Date (Optional)</label>
      <input
        id="expense-date"
        type="date"
        name="date"
        [(ngModel)]="date"
        
      />
    </div>
    <div class="form-row">
      <label for="expense-notes">Notes (Optional)</label>
      <input
        id="expense-notes"
        type="text"
        name="notes"
        [(ngModel)]="notes"
        
      />
    </div>

    <button type="submit">Save Expense</button>
  </form>
</section>
